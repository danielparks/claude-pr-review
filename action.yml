name: Claude PR Review
description: >
  Review pull requests with Claude. Detects whether a re-review is needed on
  synchronize by comparing the PR diff against a cached baseline.

inputs:
  initial-review-prompt:
    description: Prompt when no prior Claude review exists
    required: true
  re-review-prompt:
    description: Prompt when a prior Claude review exists
    required: true
  bot-username:
    description: GitHub username of the bot, used to detect prior reviews
    required: false
    default: claude
  anthropic-api-key:
    description: Anthropic API key
    required: false
  claude-code-oauth-token:
    description: Claude Code OAuth token
    required: false
  allowed-tools:
    description: >
      List of tools to allow, one per line. Passed to --allowedTools.
      WARNING: mcp__github_inline_comment__create_inline_comment requires the
      MCP server to be configured in your claude-code-action setup.
    required: false
    default: |
      mcp__github_inline_comment__create_inline_comment
      Read
      Bash(find:*)
      Bash(grep:*)
      Bash(git log:*)
      Bash(git diff:*)
      Bash(git blame:*)
      Bash(gh pr comment:*)
      Bash(gh pr diff:*)
      Bash(gh pr view:*)
      Bash(gh run list:*)
      Bash(gh run view:*)
      Bash(gh api:*)

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Build allowed-tools list
      id: tools
      shell: bash
      env:
        ALLOWED_TOOLS: ${{ inputs.allowed-tools }}
      run: |
        TOOLS=$(echo "$ALLOWED_TOOLS" | grep -v '^[[:space:]]*$' | tr '\n' ',' | sed 's/,$//')
        echo "list=$TOOLS" >> "$GITHUB_OUTPUT"

    - name: Restore diff cache
      id: cache-restore
      uses: actions/cache/restore@v4
      with:
        path: .pr-cache
        key: pr-diff-${{ github.event.pull_request.number }}-${{ github.run_id }}
        restore-keys: |
          pr-diff-${{ github.event.pull_request.number }}-

    - name: Compute and compare diffs
      id: diff
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
          git fetch --depth=1 origin "$BASE_SHA"
        fi

        mkdir -p .pr-cache
        # Remove line numbers from @@ hunk headers and delete index lines (base
        # blob SHAs) so that a clean rebase produces an identical diff.
        git diff "${BASE_SHA}..${HEAD_SHA}" \
          | grep -v '^index ' \
          | sed -e 's/^@@.*@@/@@ - - @@/' \
          > .pr-cache/new-diff.txt

        if [ -f .pr-cache/prev-diff.txt ]; then
          if diff .pr-cache/prev-diff.txt .pr-cache/new-diff.txt >/dev/null ; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            {
              echo "diff_section<<ENDSECTION"
              echo '## Changes since last review'
              echo '```'
              diff .pr-cache/prev-diff.txt .pr-cache/new-diff.txt || true
              echo '```'
              echo "ENDSECTION"
            } >> "$GITHUB_OUTPUT"
          fi
        fi

        cp .pr-cache/new-diff.txt .pr-cache/prev-diff.txt

    - name: Save diff cache
      uses: actions/cache/save@v4
      with:
        path: .pr-cache
        key: pr-diff-${{ github.event.pull_request.number }}-${{ github.run_id }}

    - name: Render PR discussion
      id: render
      if: steps.diff.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        {
          echo "pr_context<<EOF"
          # WARNING: gh-pr-render is not pinned to a version here
          npx gh-pr-render "$REPO" "$PR_NUMBER"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Select prompt
      id: select-prompt
      if: steps.diff.outputs.skip != 'true'
      shell: bash
      env:
        BOT_USERNAME: ${{ inputs.bot-username }}
        INITIAL_PROMPT: ${{ inputs.initial-review-prompt }}
        RE_REVIEW_PROMPT: ${{ inputs.re-review-prompt }}
        PR_CONTEXT: ${{ steps.render.outputs.pr_context }}
      run: |
        {
          echo "prompt<<EOF"
          if echo "$PR_CONTEXT" | grep "^### Comment by " | grep -qF " $BOT_USERNAME "; then
            printf '%s\n' "$RE_REVIEW_PROMPT"
          else
            printf '%s\n' "$INITIAL_PROMPT"
          fi
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    # WARNING: action is not pinned to a SHA here
    - uses: anthropics/claude-code-action@v1
      if: steps.diff.outputs.skip != 'true'
      with:
        anthropic_api_key: ${{ inputs.anthropic-api-key }}
        claude_code_oauth_token: ${{ inputs.claude-code-oauth-token }}
        prompt: |
          REPO: ${{ github.repository }}
          PR NUMBER: ${{ github.event.pull_request.number }}

          ${{ steps.select-prompt.outputs.prompt }}

          ${{ steps.diff.outputs.diff_section }}

          ${{ steps.render.outputs.pr_context }}
        claude_args: --allowedTools "${{ steps.tools.outputs.list }}"
