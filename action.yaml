name: Claude PR Review
description: >
  Have Claude review and re-review pull requests with the context of all the
  comments in the pull request, including inline comments along with the nearest
  diff fragment.

  The full diff is saved to a file to allow Claude to read it however it likes.
  Claude’s first step in a review is almost always to get the diff, so this
  skips at least one tool use.

  This detects whether a re-review is needed on `synchronize` (push) by
  comparing the PR diff against a cached baseline. If the PR is the same, i.e.
  it was rebased after changes were made elsewhere in the codebase, this skips
  the Claude review.

inputs:
  anthropic-api-key:
    description: >
      Anthropic API key for token-based billing. Either this or
      claude-code-oauth-token must be specified.
  claude-code-oauth-token:
    description: >
      Claude Code OAuth token for use with a subscription account. Generate with
      `claude setup-token`. Either this or anthropic-api-key must be specified.
  prompt:
    description: >
      Prompt sent to Claude for both initial reviews and re-reviews. Claude
      determines the current state of the PR from context.
    default: |
      Please review this pull request. /tmp/pr.patch contains the overall diff
      for the PR, the PR branch is checked out in the current working directory,
      and the PR discussion is included below.

      If there are prior review comments from you in the PR discussion, treat
      this as a re-review. Respond to discussion as appropriate, and review new
      changes. If nothing has changed there is no need to note it unless the
      user seems to think that changes were made.

      Only post GitHub comments — don't submit review text as messages.

      For the commands below: write the comment body to a file under
      /tmp/pr-review-scratch first with the Write tool, then pass that file's
      path with `--body-file`. This avoids shell special characters.

      1. Use `pr-review reply-inline-comment --comment-id ID --body-file PATH`
         to reply to existing inline comments if they have been resolved, if
         changes have been made that haven’t resolved them, or if you have new
         information. This posts immediately.
      2. Use `pr-review queue-inline-comment --path PATH --line N --body-file
         PATH` for every specific code issue you find in new code. This only
         queues the comment; nothing is posted yet.
      3. Use `pr-review comment-review --body-file PATH` once at the end if
         you want to leave top-level feedback. This will submit all queued
         comments; if you don't call it queued comments will be submitted
         after you finish. Do not repeat comments made inline, though you may
         briefly list issues that remain unresolved from a previous review.

      If it's useful you may link to specific comments, but don’t refer to them
      by ID — the user does not have easy access to that.

      - `#discussion_rID` — an inline comment.
      - `#pullrequestreview-ID` — a top-level review comment.
      - `#issuecomment-ID` — a top-level non-review comment.
  additional-prompt:
    description: >
      Appended after `prompt`.

      This is useful if you just want to add text to the default prompt.
    default:
  allowed-tools:
    description: >
      List of tools to allow Claude to use, one per line. Passed to
      `--allowedTools`.
    # Note that absolute paths require a double slash prefix.
    # From https://code.claude.com/docs/en/agent-sdk/permissions.md:
    #
    # > Use `//path` for an absolute filesystem path: a deny rule of
    # > `Edit(//secrets/**)` blocks writes anywhere under `/secrets` on disk.
    # > With a single leading slash, `Edit(/secrets/**)` anchors at the rule's
    # > source instead.
    #
    # `gh-pr-render` is needed to view long inline comment threads.
    default: |
      Read
      Edit(//tmp/pr-review-scratch/**)
      Bash(find:*)
      Bash(grep:*)
      Bash(git log:*)
      Bash(git diff:*)
      Bash(git blame:*)
      Bash(gh pr diff:*)
      Bash(gh pr view:*)
      Bash(gh run list:*)
      Bash(gh run view:*)
      Bash(gh-pr-render:*)
      Bash(pr-review queue-inline-comment:*)
      Bash(pr-review reply-inline-comment:*)
      Bash(pr-review comment-review:*)
  additional-allowed-tools:
    description: >
      List of additional tools to allow Claude to use, one per line. Added to
      `allowed-tools` and then passed to `--allowedTools`.

      This is useful if you just want to extend the default tool list. In
      particular, see the “Opt-in tools” section of `cli/README.md` for
      `pr-review` subcommands that are deliberately excluded from the default
      `allowed-tools` list.
    default:
  gh-pr-render-version:
    description: Version of the `gh-pr-render` tool to use.
    default: 0.5.0
  thinking-log-artifact-retention:
    description: >
      How long to keep the Claude thinking log artifact in days. "Disabled" or 0
      means not to create it.

      The thinking log is an HTML file that contains some of Claude’s internal
      thoughts and all of its tool uses.

      WARNING: The log can contain repository secrets. Artifacts are available
      to the public on public repositories.

      This attempts to redact GitHub tokens, Anthropic API keys, and other
      Anthropic secrets. There is no guarantee that it will succeed — keys could
      be broken up into multiple strings.
    default: disabled

runs:
  using: composite
  steps:
    - name: Build allowed-tools list
      id: tools
      shell: bash
      env:
        ALLOWED_TOOLS: |
          ${{ inputs.allowed-tools }}
          ${{ inputs.additional-allowed-tools }}
      run: |
        # Build allowed-tools list
        set -euo pipefail

        echo "list=$(
          echo "$ALLOWED_TOOLS" \
            | grep -v '^[[:space:]]*$' \
            | tr '\n' ',' \
            | sed 's/,$//' \
          )" >> "$GITHUB_OUTPUT"

    - name: Configure pr-review CLI
      shell: bash
      env:
        CLI_DIR: ${{ github.action_path }}/cli
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: | # zizmor: ignore[github-env] not user input
        # Put pr-review (see cli/README.md) on PATH for Claude's Bash tool, and
        # expose PR_NUMBER as an ambient env var. GITHUB_TOKEN is set by Claude
        # to the special Claude App token.
        set -euo pipefail
        echo "$CLI_DIR" >> "$GITHUB_PATH"
        echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"
        node "$CLI_DIR/pr-review" init

        # Scratch space for Claude to stage --body-file content in.
        mkdir -p /tmp/pr-review-scratch

    - name: diff cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: .pr-cache
        key: pr-diff-${{ github.event.pull_request.number }}-${{ github.run_id }}
        restore-keys: |
          pr-diff-${{ github.event.pull_request.number }}-

    - name: Compute and compare diffs
      id: diff
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        REPO: ${{ github.repository }}
        REPO_URL: "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
      run: |
        # Get the merge base SHA from the API, then fetch and diff locally.
        set -euo pipefail

        # Using the merge base (rather than BASE_SHA) ensures we only diff
        # what the PR author changed, excluding commits pushed to the base
        # branch after this branch was created.
        MERGE_BASE=$(gh api "repos/$REPO/compare/${BASE_SHA}...${HEAD_SHA}" \
          --jq '.merge_base_commit.sha')
        if [ -z "$MERGE_BASE" ]; then
          echo "::error::Failed to resolve merge base from GitHub API" >&2
          exit 1
        fi

        if ! git cat-file -e "${MERGE_BASE}^{commit}" 2>/dev/null; then
          git fetch --depth=1 "$REPO_URL" "$MERGE_BASE"
        fi
        if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
          git fetch --depth=1 "$REPO_URL" "$HEAD_SHA"
        fi

        # Produce overall diff for PR for Claude.
        git diff "${MERGE_BASE}..${HEAD_SHA}" >/tmp/pr.patch

        mkdir -p .pr-cache

        # Remove line numbers from @@ hunk headers and delete index lines (base
        # blob SHAs) so that a clean rebase produces an identical diff.
        # Note: binary files are excluded from the diff and won't be reviewed.
        grep -v '^index ' /tmp/pr.patch \
          | sed -e 's/^@@.*@@/@@ - - @@/' \
          > .pr-cache/new.patch

        if [ -f .pr-cache/prev.patch ]; then
          if diff .pr-cache/prev.patch .pr-cache/new.patch >/dev/null ; then
            echo PR unchanged
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo PR changed
            DELIM=$(openssl rand -hex 8)
            {
              echo "diff_section<<EOF-${DELIM}"
              echo '## Changes since last review'
              echo '```'
              diff .pr-cache/prev.patch .pr-cache/new.patch || true
              echo '```'
              echo "EOF-${DELIM}"
            } >> "$GITHUB_OUTPUT"
          fi
        fi

        cp .pr-cache/new.patch .pr-cache/prev.patch

    - name: Render PR discussion
      id: render
      if: steps.diff.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        RENDER_VERSION: ${{ inputs.gh-pr-render-version }}
      run: |
        # Generate PR context
        set -euo pipefail

        DELIM=$(openssl rand -hex 8)
        {
          echo "pr_context<<EOF-${DELIM}"
          # Don't use local node_modules. Without `--prefix` it fails when
          # running in the gh-pr-render repo.
          npm exec --yes --prefix $(mktemp -d) \
            --package=gh-pr-render@"$RENDER_VERSION" -- \
            gh-pr-render "$REPO" "$PR_NUMBER"
          echo "EOF-${DELIM}"
        } >> "$GITHUB_OUTPUT"

    - uses: anthropics/claude-code-action@51ea8ea73a139f2a74ff649e3092c25a904aed7e # v1.0.123
      id: claude
      if: steps.diff.outputs.skip != 'true'
      with:
        anthropic_api_key: ${{ inputs.anthropic-api-key }}
        claude_code_oauth_token: ${{ inputs.claude-code-oauth-token }}
        prompt: |
          REPO: ${{ github.repository }}
          PR NUMBER: ${{ github.event.pull_request.number }}

          ${{ inputs.prompt }}
          ${{ inputs.additional-prompt }}

          ${{ steps.diff.outputs.diff_section }}

          ${{ steps.render.outputs.pr_context }}
        claude_args: --allowedTools "${{ steps.tools.outputs.list }}"

    - name: Submit any review comments Claude queued but didn't post
      # Runs even if the step above failed or Claude never called
      # `comment-review` itself (it's a no-op when nothing was ever queued).
      if: always() && steps.diff.outputs.skip != 'true'
      shell: bash
      env:
        # The Claude App token, if the calling workflow granted `id-token:
        # write` and the app is installed.
        GITHUB_TOKEN: ${{ steps.claude.outputs.github_token || github.token }}
        CLI_SCRIPT: ${{ github.action_path }}/cli/pr-review
        # Downgrade queued APPROVEs when:
        #   - The Claude step didn't succeed
        #   - We did not get the Claude App (claude[bot]) token
        DOWNGRADE_APPROVAL: >-
          ${{
            (
              steps.claude.outputs.github_token == ''
              || steps.claude.outcome != 'success'
            )
            && 'true'
            || ''
          }}
      run: |
        # Submit any review comments Claude queued but didn't post
        set -euo pipefail
        FLAGS=()
        if [[ -n "$DOWNGRADE_APPROVAL" ]]; then
          FLAGS+=(--downgrade-approval)
        fi
        node "$CLI_SCRIPT" sweep "${FLAGS[@]}"

    - name: Parse retention input
      id: retention
      if: always() && steps.diff.outputs.skip != 'true'
      shell: bash
      env:
        RETENTION: ${{ inputs.thinking-log-artifact-retention }}
      run: |
        if [[ "$RETENTION" =~ ^[0-9]+$ && "$RETENTION" != 0 ]]; then
          # Positive integer
          echo "days=${RETENTION}" >> "$GITHUB_OUTPUT"
        fi

    - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      if: always() && steps.retention.outputs.days != ''
      with:
        # No Python project, so no files to hash into uv cache key.
        cache-dependency-glob: ""

    - name: Run conversation extractor
      id: conversation-extract
      if: always() && steps.retention.outputs.days != ''
      shell: bash
      env:
        OUTPUT: ${{ runner.temp }}/Claude-review-conversations
        RETENTION: ${{ steps.retention.outputs.days }}
        SCRIPTS: ${{ github.action_path }}/scripts
      run: |
        # claude-extract --all --format html --detailed
        set -euo pipefail
        shopt -s nullglob

        uvx --from claude-conversation-extractor==1.1.2 claude-extract \
          --all --format html --detailed --output "$OUTPUT"

        "${SCRIPTS}/redact" "$OUTPUT"/*

        files=("$OUTPUT"/*)
        case ${#files[@]} in
          0) ;;
          1)
            echo "path=${files[0]}" >> "$GITHUB_OUTPUT"
            echo "archive=false" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "path=$OUTPUT" >> "$GITHUB_OUTPUT"
            echo "archive=true" >> "$GITHUB_OUTPUT"
            ;;
        esac

    - name: Create artifact from conversation
      id: conversation-upload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always() && steps.conversation-extract.outputs.path != ''
      with:
        # Name is not used if this is uploading a single, unarchived file.
        name: Claude-review-conversations.zip
        path: ${{ steps.conversation-extract.outputs.path }}
        retention-days: ${{ steps.retention.outputs.days }}
        archive: ${{ steps.conversation-extract.outputs.archive }}
        # We should not get here if the log did not exist:
        if-no-files-found: error

    - name: Output artifact URL
      if: always() && steps.conversation-upload.outcome == 'success'
      shell: bash
      env:
        URL: ${{ steps.conversation-upload.outputs.artifact-url }}
      run: echo "::notice::Conversation artifact ${URL}"
