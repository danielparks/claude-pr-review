repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-json
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=no"]
      - id: no-commit-to-branch
  - repo: https://github.com/crate-ci/typos
    rev: v1.46.1
    hooks:
      - id: typos
        args: []
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: system
        entry: npx prettier --check
        pass_filenames: true
        types_or: [javascript, json, markdown, yaml]
        stages: [pre-commit, pre-merge-commit]
      - id: mcp-server tests
        name: mcp-server tests
        language: system
        entry: node --test --test-timeout=5000 mcp-server/*.test.js
        pass_filenames: false
        files: ^mcp-server/
        stages: [pre-commit, pre-merge-commit]
      - id: generate-workflows
        name: generate-workflows
        language: system
        entry: scripts/generate-workflows
        pass_filenames: false
        files: workflow.*\.yaml$|^scripts/generate-workflows$
        stages: [pre-commit, pre-merge-commit]
      - id: zizmor
        name: zizmor
        language: system
        entry: scripts/zizmor-online --persona=pedantic
        pass_filenames: true
        files: workflow.*\.yaml$|^action\.yaml$
        stages: [pre-commit, pre-merge-commit]
      - id: actionlint
        name: actionlint
        language: system
        entry: actionlint
        pass_filenames: true
        types_or: [yaml]
        files: workflow
        stages: [pre-commit, pre-merge-commit]
      - id: ghalint workflow
        name: ghalint workflow
        language: system
        entry: ghalint run
        pass_filenames: true
        types_or: [yaml]
        files: workflow
        stages: [pre-commit, pre-merge-commit]
      - id: ghalint action
        name: ghalint action
        language: system
        entry: ghalint run-action
        pass_filenames: true
        types_or: [yaml]
        files: ^action\.yaml$
        stages: [pre-commit, pre-merge-commit]
