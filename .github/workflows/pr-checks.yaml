name: Checks

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  prek:
    name: prek
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Update via `scripts/update-pinned-tools`, not by hand.
      ACTIONLINT_VERSION: v1.7.12
      GHALINT_VERSION: v1.5.6
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Cache actionlint
        id: cache-actionlint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/bin/actionlint
          key: actionlint-${{ runner.os }}-${{ env.ACTIONLINT_VERSION }}
      - name: Install actionlint
        if: steps.cache-actionlint.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Download and install actionlint
          set -euo pipefail

          mkdir actionlint
          cd actionlint
          gh release download "$ACTIONLINT_VERSION" \
            --repo rhysd/actionlint \
            --pattern 'actionlint_*_linux_amd64.tar.gz'
          gh attestation verify actionlint_*.tar.gz \
            --repo rhysd/actionlint

          tar xzf actionlint_*.tar.gz
          cp actionlint /usr/local/bin
      - name: Cache ghalint
        id: cache-ghalint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/bin/ghalint
          key: ghalint-${{ runner.os }}-${{ env.GHALINT_VERSION }}
      - name: Install ghalint
        if: steps.cache-ghalint.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Download and install ghalint
          set -euo pipefail

          mkdir ghalint
          cd ghalint
          gh release download "$GHALINT_VERSION" \
            -R suzuki-shunsuke/ghalint \
            -p 'ghalint_*_linux_amd64.tar.gz'
          gh attestation verify ghalint_*.tar.gz \
            -R suzuki-shunsuke/ghalint \
            --signer-workflow suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml

          tar xzf ghalint_*.tar.gz
          cp ghalint /usr/local/bin
      - uses: j178/prek-action@bdca6f102f98e2b4c7029491a53dfd366469e33d # v2.0.4
        with:
          # no-commit-to-branch fails on push to main.
          extra-args: >
            --all-files
            --skip typos
            --skip zizmor
            --skip no-commit-to-branch

  typos:
    name: typos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: crate-ci/typos@5374cbf686e897b15713110e233094e2874de7ef # v1.46.1

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      security-events: write # reporting lint failures
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6
        with:
          inputs: .
          persona: pedantic
