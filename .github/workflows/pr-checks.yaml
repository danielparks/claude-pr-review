name: Checks

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# These would more naturally be separate jobs, but GitHub actions “bills” each
# job separately and rounds up to the next minute, so four 10 second jobs “cost”
# my account 4 action minutes.
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Update via `scripts/update-pinned-tools`, not by hand.
      ACTIONLINT_VERSION: v1.7.12
      GHALINT_VERSION: v1.5.6
    permissions:
      security-events: write # reporting lint failures
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Cache actionlint
        id: cache-actionlint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/bin/actionlint
          key: actionlint-${{ runner.os }}-${{ env.ACTIONLINT_VERSION }}
      - name: Install actionlint
        if: steps.cache-actionlint.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Download and install actionlint
          set -euo pipefail

          mkdir actionlint
          cd actionlint
          gh release download "$ACTIONLINT_VERSION" \
            --repo rhysd/actionlint \
            --pattern 'actionlint_*_linux_amd64.tar.gz'
          gh attestation verify actionlint_*.tar.gz \
            --repo rhysd/actionlint

          tar xzf actionlint_*.tar.gz
          cp actionlint /usr/local/bin
      - name: Cache ghalint
        id: cache-ghalint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/bin/ghalint
          key: ghalint-${{ runner.os }}-${{ env.GHALINT_VERSION }}
      - name: Install ghalint
        if: steps.cache-ghalint.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Download and install ghalint
          set -euo pipefail

          mkdir ghalint
          cd ghalint
          gh release download "$GHALINT_VERSION" \
            -R suzuki-shunsuke/ghalint \
            -p 'ghalint_*_linux_amd64.tar.gz'
          gh attestation verify ghalint_*.tar.gz \
            -R suzuki-shunsuke/ghalint \
            --signer-workflow suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml

          tar xzf ghalint_*.tar.gz
          cp ghalint /usr/local/bin

      - name: Check for ${{ 'FIX' }}ME # zizmor: ignore[obfuscation]
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Check files changed in PR for FIX+ME and annotate
          set -euo pipefail

          # The checkout step only fetches HEAD_SHA (fetch-depth: 1), so
          # BASE_SHA is missing locally until we fetch it explicitly.
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi

          found=0
          while IFS= read -r file; do
            [[ -f "$file" ]] || continue
            while IFS=: read -r lineno _; do
              printf '%s%s\n' "::error file=${file},line=${lineno}::FIX" \
                'ME found — please resolve before merging'
              found=1
            done < <(grep -n "[F]IXME" "$file" || true)
          done < <(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
          exit $found

      - uses: j178/prek-action@bdca6f102f98e2b4c7029491a53dfd366469e33d # v2.0.4
        if: ${{ !cancelled() }}
        with:
          # no-commit-to-branch fails on push to main.
          extra-args: >
            --all-files
            --skip typos
            --skip zizmor
            --skip no-commit-to-branch

      - uses: crate-ci/typos@5374cbf686e897b15713110e233094e2874de7ef # v1.46.1
        if: ${{ !cancelled() }}

      - uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6
        if: ${{ !cancelled() }}
        with:
          inputs: .
          persona: pedantic
