# Generated from workflow-review.yaml — do not edit directly.

name: Claude
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-review:
    name: Review
    if: |
      contains(
        fromJSON('["OWNER", "COLLABORATOR"]'),
        github.event.pull_request.author_association
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # contents: write is not safe without branch protection rules
      contents: read # Read files in private repos
      pull-requests: write # Write PR comments
      id-token: write # Coordinate with Claude app
      issues: write # Write issue comments
      actions: read # Read GitHub action results
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: ./
        with:
          # You can set either of these secrets. If both are set, the API key
          # seems to win.
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          initial-review-prompt: |
            Please review this pull request. The PR branch is already checked
            out in the current working directory, and the PR discussion is
            included below.
          re-review-prompt: |
            This pull request has been updated. The PR discussion (including
            your prior review) and a diff of what changed since your last
            review are included below.

            Update your feedback to reflect the current state of the PR:
            - Update any comments that have been addressed.
            - Flag any new issues introduced by the changes.
