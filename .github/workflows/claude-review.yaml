# Generated from workflow-review.yaml — do not edit directly.

name: Claude Review
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-review:
    name: Review
    if: |
      contains(
        fromJSON('["OWNER", "COLLABORATOR"]'),
        github.event.pull_request.author_association
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # contents: write is not safe without branch protection rules
      contents: read # Read files in private repos
      pull-requests: write # Write PR comments
      id-token: write # Coordinate with Claude app
      issues: write # Write issue comments
      actions: read # Read GitHub action results
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: $/.
        with:
          # You can set either of these secrets. If both are set, the API key
          # seems to win.
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # WARNING: this could expose secrets to the public. It *attempts* to
          # redact GitHub tokens and Anthropic secrets, but no guarantees.
          thinking-log-artifact-retention: 7
